name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instala Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Instala dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Ejecuta lint
      - name: Run lint
        run: npm run lint

      # 5. Chequea tipos y compila
      - name: Run build
        run: npm run build

      # 6. Ejecuta tests con coverage
      - name: Run tests with coverage
        run: npm run test:coverage

      # 7. Instala Java para el emulador de Firestore
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 8. Instala Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # 9. Prueba firestore.rules en el emulador
      - name: Run Firestore rules tests
        run: npm run test:rules